# MON PARKING — tests, build Vite et publication.
#
# Chaîne : build (parallèle) + test (Vitest) -> deploiements.
# Les deux jobs de deploiement portent « needs: [build, test] » : un seul test
# en échec les rend « skipped », donc rien n'est publié. Aucun continue-on-error
# n'est present, volontairement.

name: Tests, build & deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  test:
    name: Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund

      # « vitest run » et non « vitest » : la commande nue demarre en mode
      # surveillance et bloquerait la CI jusqu'au timeout du job.
      - name: Tests unitaires
        run: npm test

  build:
    name: Build Vite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Vérifier les artefacts PWA
        run: |
          test -f dist/index.html      || { echo "dist/index.html absent"; exit 1; }
          test -f dist/sw.js           || { echo "dist/sw.js absent"; exit 1; }
          test -f dist/manifest.webmanifest || { echo "manifest absent"; exit 1; }
          echo "Artefacts PWA présents :"
          ls -lh dist/index.html dist/sw.js dist/manifest.webmanifest

      - name: Repli 404.html
        run: cp dist/index.html dist/404.html

      - name: Archiver dist
        uses: actions/upload-artifact@v4
        with:
          name: mon-parking-dist
          path: dist
          retention-days: 14

      - name: Préparer l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pages:
    name: Publier sur GitHub Pages
    needs: [build, test]
    if: github.event_name != 'pull_request' && vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-node:
    name: Déclencher l'hébergeur Node
    needs: [build, test]
    if: github.event_name == 'push' && vars.DEPLOY_HOOK_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Appeler le webhook de déploiement
        env:
          HOOK: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          test -n "$HOOK" || { echo "DEPLOY_HOOK_URL absent : job ignoré"; exit 0; }
          curl --fail --silent --show-error --max-time 30 \
            -X POST "$HOOK" -o /dev/null -w 'webhook HTTP %{http_code}\n'
