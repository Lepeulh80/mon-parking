# Blueprint Render — MON PARKING (serveur Node + SQLite, authentification réelle).
# L'origine publique est déduite de RENDER_EXTERNAL_URL fournie par Render :
# aucune saisie préalable n'est nécessaire pour que le service démarre.
# Plan gratuit : disque éphémère et mise en veille après 15 min sans trafic.
services:
  - type: web
    name: mon-parking
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: AUTH_TRUST_PROXY
        value: "1"
      - key: AUTH_DB
        value: /app/.server-data/auth.sqlite
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: AUTH_2FA_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PIN
        sync: false
      - key: ADMIN_LOT_NAME
        value: Auto Prestige
      - key: ADMIN_NAME
        value: Kouadio Yao
      - key: AUTH_MAX_LOGIN_ATTEMPTS
        value: "20"
